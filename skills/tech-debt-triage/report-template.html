<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tech-debt-triage <repo name></title>
<style>
body{margin:0;background:#fafaf9;color:#0f172a;font:15px/1.55 system-ui,sans-serif}
main{max-width:56rem;margin:0 auto;padding:40px 16px}
h1,h2,h3{font-family:Georgia,serif;font-weight:500;margin:0}
h1{font-size:30px}h2{font-size:24px;margin:48px 0 16px}h3{font-size:20px}
.muted{color:#475569}.sub{color:#64748b;font-size:13px}
.mono,.files,.id{font-family:ui-monospace,monospace}
.files{font-size:12px;color:#94a3b8;margin:4px 0;overflow-wrap:anywhere}
.id{font-size:13px;color:#64748b}
.badges,.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.badge{border-radius:999px;padding:2px 10px;font-size:12px;background:#f1f5f9;text-decoration:none;color:inherit}
.b-act,.l-act{background:#d1fae5;color:#065f46}.b-cov{background:#e0e7ff;color:#3730a3}
.l-later{background:#fef3c7;color:#92400e}.l-skip{background:#e2e8f0;color:#334155}
.legend a{font-size:14px;padding:4px 12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;margin:0 0 28px}
.head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0}
@media(max-width:640px){.ba{grid-template-columns:1fr}}
.pane{border:1px solid #e2e8f0;border-radius:8px;padding:12px;overflow-x:auto}
.pane.after{border-color:#6ee7b7}
.cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:8px}
.after .cap{color:#047857}
.dup{font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap}.diff{color:#dc2626}
.fig{text-align:center}.fig svg{max-width:100%;height:auto}
dl{display:grid;grid-template-columns:6rem 1fr;gap:4px 16px;margin:12px 0 0}
dt{font-weight:600}dd{margin:0}
.wins{margin:12px 0 0;padding-left:20px}
@media(max-width:640px){dl{grid-template-columns:1fr}}
ul.list{list-style:none;padding:0;margin:0}
ul.list li{padding:12px 0;border-bottom:1px solid #e2e8f0}
ul.list .muted{font-size:14px;margin-top:4px}
.t-later{color:#b45309}
</style>
</head>
<body>
<main>
<header>
  <h1><repo name> @ <short sha></h1>
  <p class="sub"><date> · <scope> · <n> candidates</p>
  <div class="legend">
    <a href="#act" class="badge l-act"><n> Act now</a>
    <a href="#later" class="badge l-later"><n> Later</a>
    <span class="badge l-skip"><n> Skip</span>
  </div>
  <p class="sub">Q quality · P performance (veto only) · C change cost — + better, = same, − worse.</p>
</header>

<section id="act"><h2>Act now</h2>
<article id="C1" class="card">
  <div class="head"><span class="id">C1</span><h3><short title></h3></div>
  <div class="badges">
    <a href="<issue url>" class="badge b-act">#N · filed</a>
    <!-- covered: <a href="<issue url>" class="badge b-cov">#N · covered by open issue</a> -->
    <span class="badge mono">Q+ P= C+</span>
  </div>
  <p class="files">path/a.go:12, path/b.go:40</p>
  <!-- restatement: replaces the files line and the before/after panes
  <div class="ba">
    <div class="pane"><div class="files">path/a.go:12</div><div class="dup">same line
<span class="diff">if n &lt; 0 {</span></div></div>
    <div class="pane"><div class="files">path/b.go:40</div><div class="dup">same line
<span class="diff">if n &lt;= 0 {</span></div></div>
  </div> -->
  <!-- structural item -->
  <div class="ba">
    <div class="pane"><div class="cap">Before</div><div class="fig"><!-- c1-before diagram --></div></div>
    <div class="pane after"><div class="cap">After</div><div class="fig"><!-- c1-after diagram --></div></div>
  </div>
  <dl>
    <dt>Problem</dt><dd><what is wrong today></dd>
    <dt>Fix</dt><dd><the change></dd>
  </dl>
  <ul class="wins"><li><win></li></ul>
</article>
</section>

<section id="later"><h2>Later</h2>
<p class="sub">Claim holds; no defect today. Not filed.</p>
<ul class="list">
<li><div><span class="id t-later">C4</span> <span class="badge mono">Q= P= C+</span> <claim></div>
<div class="muted"><evidence></div><div class="files">path/c.go:7</div></li>
</ul>
</section>
</main>
</body>
</html>

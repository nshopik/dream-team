<!doctype html>
<meta charset="utf-8">
<title>Stats</title>
<p>Games: <span id="games"></span></p>
<p>Win rate: <span id="win-rate"></span></p>
<script>
fetch('stats.json')
  .then((r) => r.json())
  .then((stats) => {
    document.getElementById('games').textContent = stats.games;
    document.getElementById('win-rate').textContent = stats.win_rate.toFixed(2);
  });
</script>
